name: Deploy PWA to GitHub Pages

# Cada corrida lee la tasa del BCV (bcv.org.ve) y Binance P2P, genera rates.json y publica.
#  - push a develop: deploy normal (con tasas frescas).
#  - schedule: refresca las tasas. El BCV publica la del próximo día hábil en la tarde, así que
#    entre semana de 12:00 a 23:59 (hora de Caracas, UTC-4) se revisa cada 30 min; el resto, cada 3 h.
#  - Cuando el BCV publica una tasa nueva, el bot la commitea en data/bcv.json: queda el historial
#    y el repo tiene actividad (GitHub apaga los schedule de repos públicos tras 60 días sin ella).
on:
  push:
    branches: ["develop"]
  schedule:
    - cron: "7,37 16-23 * * 1-5"   # lun-vie 12:07-19:37 VET
    - cron: "7,37 0-3 * * 2-6"     # lun-vie 20:07-23:37 VET
    - cron: "17 */3 * * *"         # siempre, cada 3 h
  workflow_dispatch:

permissions:
  contents: write   # commitear data/bcv.json
  issues: write     # avisar si bcv.org.ve deja de leerse
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false   # en cola: un push no debe cortar a la mitad el commit del bot

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop   # el último develop (en cola puede haber llegado otro commit)

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests
        run: node --test

      - name: Leer tasas (BCV y Binance P2P)
        id: rates
        run: node scripts/update-rates.js

      - name: Commitear tasa BCV nueva
        if: steps.rates.outputs.bcv_changed == 'true'
        env:
          SUMMARY: ${{ steps.rates.outputs.bcv_summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bcv.json
          git commit -m "Tasa BCV: $SUMMARY"
          for i in 1 2 3; do
            git pull --rebase origin develop && git push origin HEAD:develop && exit 0
            sleep 5
          done
          echo "::warning::No se pudo subir data/bcv.json; se publica igual"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      # La API de artefactos a veces aún no lista el recién subido ("No artifacts named
      # github-pages were found", aunque la subida terminó bien): se reintenta tras una pausa.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Esperar antes de reintentar el deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (reintento)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Si bcv.org.ve no se puede leer y ya faltan 2+ días hábiles de tasa (p. ej. rediseñaron la
      # página), abre un issue (uno solo) para que llegue el aviso; lo cierra cuando se vuelve a leer.
      - name: Avisar si no se puede leer el BCV
        if: ${{ !cancelled() && steps.rates.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT: ${{ steps.rates.outputs.bcv_alert }}
          BCV_OK: ${{ steps.rates.outputs.bcv_ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="No se puede leer la tasa del BCV"
          NUM=$(gh issue list --state open --limit 50 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$ALERT" ] && [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body "$(printf '%s\n\nLa app sigue funcionando con la serie de ve.dolarapi.com, pero sin la lectura directa de bcv.org.ve. Si el BCV cambió su página, actualiza `parseBcvHtml` y el fixture en `test/fixtures/`.\n\nCorrida: %s\n\nSe cierra solo cuando se vuelva a leer la tasa.\n\ncc @krojasalfaro7' "$ALERT" "$RUN_URL")"
          elif [ "$BCV_OK" = "true" ] && [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "La tasa del BCV se volvió a leer ($RUN_URL)."
          fi
