<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Calculadora BCV · Binance P2P</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c0e">
<meta name="background-color" content="#0b0c0e">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Calculadora lite con conversión en vivo a tasa BCV y Binance P2P">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc Bs">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- Android / Chrome -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<style>
  :root{
    --bg:#000000;
    --panel:#000000;
    --key:#161616;
    --accent:#ff7a3d;
    --text:#f5f5f2;
    --muted:#8a8d93;
    --history:#5a5c60;
    --bcv:#5b8fb0;
    --binance:#f0b90b;
    --amarillo:#f7c948;
    --azul:#2b4c8c;
    --rojo:#c1272d;
    --border:rgba(255,255,255,.08);
    --hairline:rgba(255,255,255,.25);
    --row-bg:rgba(255,255,255,.03);
    --shadow:rgba(0,0,0,.6);
    --gap:#000000;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f2f2f0;
    --panel:#f2f2f0;
    --key:#e9e9e6;
    --accent:#e35a1c;
    --text:#17181c;
    --muted:#6b6f76;
    --history:#9a9da3;
    --border:rgba(0,0,0,.08);
    --hairline:rgba(0,0,0,.25);
    --row-bg:rgba(0,0,0,.04);
    --shadow:rgba(0,0,0,.15);
    --gap:#e2e2df;
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:16px;
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
    overscroll-behavior:none;
  }
  .app{
    width:100%;
    max-width:360px;
    background:var(--panel);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 20px 50px var(--shadow);
    border:1px solid var(--border);
  }
  .tricolor{height:3px;display:flex;}
  .tricolor span{flex:1;}
  .tricolor .a{background:var(--amarillo);}
  .tricolor .b{background:var(--azul);}
  .tricolor .c{background:var(--rojo);}

  .display{padding:16px 20px 14px;}
  .top-row{display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:6px;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#3ac16a;flex-shrink:0;}
  .status-dot.offline{background:#8a8d93;}
  .theme-toggle{
    background:none;
    border:none;
    color:var(--muted);
    font-size:15px;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
    margin-right:auto;
  }
  .refresh-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
  }
  .refresh-btn.loading{animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .history{
    display:flex;
    flex-direction:column;
    gap:2px;
    text-align:right;
    max-height:64px;
    overflow-y:auto;
    scrollbar-width:none;
  }
  .history::-webkit-scrollbar{display:none;}
  .history-row{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:13px;
    color:var(--history);
    white-space:nowrap;
    flex-shrink:0;
  }
  .history-row .h-expr{margin-right:6px;}
  .history-row.op1{opacity:.35;}
  .history-row.op2{opacity:.5;}
  .history-row.op3{opacity:.65;}
  .history-row.op4{opacity:.8;}

  .expr-line{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:16px;
    color:var(--muted);
    text-align:right;
    min-height:20px;
    letter-spacing:.3px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
  }
  .expr-line::-webkit-scrollbar{display:none;}

  .digits{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-weight:500;
    text-align:right;
    line-height:1.15;
    letter-spacing:.5px;
    min-height:52px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
    margin-top:2px;
    font-size:34px;
    transition:font-size .08s ease;
  }
  .digits.is-result{ font-size:44px; }
  .digits::-webkit-scrollbar{display:none;}

  .conversions{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
  .conv-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    background:var(--row-bg);
    border-radius:10px;
    padding:7px 10px;
  }
  .conv-row[hidden]{display:none;}
  .conv-label{display:flex; align-items:center; gap:7px; min-width:0;}
  .conv-name{display:flex; flex-direction:column; line-height:1.25; min-width:0;}
  .conv-title{white-space:nowrap;}
  .conv-sub{font-size:10px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .conv-sub.manual{color:var(--accent); opacity:1;}
  .conv-right{display:flex; align-items:center; flex-shrink:0;}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .dot.bcv{background:var(--bcv);}
  .dot.bcv-next{background:transparent; box-shadow:inset 0 0 0 1.5px var(--bcv);}
  .dot.binance{background:var(--binance);}
  .rate-edit{
    background:none;
    border:none;
    border-bottom:1px dashed var(--hairline);
    color:var(--text);
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:12.5px;
    width:72px;
    text-align:right;
    padding:0 0 1px;
  }
  .rate-edit:focus{outline:none; border-bottom-color:var(--text);}
  .rate-edit.manual{color:var(--accent); border-bottom-color:var(--accent);}
  .rate-reset{
    background:none;
    border:none;
    color:var(--accent);
    font-size:15px;
    line-height:1;
    padding:2px 6px;
    cursor:pointer;
  }
  .rate-reset[hidden]{display:none;}
  .update-info.warn{color:var(--accent);}
  .footnote a{color:inherit;}
  .conv-result{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    color:var(--text);
    font-size:14px;
    font-weight:600;
    margin-left:8px;
  }

  .update-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
    padding:0 2px;
  }
  .update-info{
    font-size:10.5px;
    color:var(--muted);
  }
  .update-btn{
    display:flex;
    align-items:center;
    gap:5px;
    background:none;
    border:none;
    color:var(--accent);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:3px 4px;
  }
  .update-btn .spin{display:inline-block;}
  .update-btn.loading .spin{animation:spin 0.9s linear infinite;}

  .keypad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--gap);
    padding-top:1px;
  }
  button.key{
    border:none;
    background:var(--key);
    color:var(--text);
    font-size:24px;
    font-weight:400;
    padding:16px 0;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
  }
  button.key:active{filter:brightness(1.5);}
  button.key.op{color:var(--accent); font-weight:500; font-size:22px;}
  button.key.paren{color:var(--accent); font-weight:500; font-size:19px;}
  button.key.fn{color:var(--accent); font-size:20px;}
  button.key.fn.clear{font-weight:700;}
  button.key.mode-key{
    color:var(--text);
    font-size:12px;
    font-weight:700;
    letter-spacing:.2px;
  }
  .key-eq-cell{display:flex; align-items:center; justify-content:center; background:var(--key);}
  button.key.eq{
    background:var(--accent);
    color:#1a0e00;
    font-weight:700;
    font-size:22px;
    width:52px;
    height:52px;
    border-radius:50%;
    padding:0;
  }

  .footnote{
    text-align:center;
    color:var(--muted);
    font-size:10.5px;
    padding:8px 12px 4px;
    line-height:1.4;
  }
  .update-badge{
    background:none;
    border:none;
    color:var(--accent);
    font-size:10.5px;
    font-weight:700;
    cursor:pointer;
    padding:0;
    margin-left:2px;
    text-decoration:underline;
    font-family:inherit;
  }
  .update-badge[hidden]{display:none;}

  .install-row{
    padding:0 12px;
  }
  .install-btn{
    display:none;
    width:100%;
    background:var(--key);
    color:var(--text);
    border:none;
    border-radius:12px;
    padding:11px 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:14px;
  }
  .install-btn.show{display:block;}

  @media (max-width:480px){
    body{
      padding:0;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
      align-items:stretch;
    }
    .app{
      max-width:none;
      width:100%;
      height:100dvh;
      border-radius:0;
      box-shadow:none;
      border:none;
      display:flex;
      flex-direction:column;
    }
    .keypad{
      flex:1;
      grid-template-rows:repeat(6, 1fr);
      min-height:280px;
    }
    button.key{
      height:100%;
      padding:0;
      font-size:26px;
    }
    button.key.op{font-size:24px;}
    .key-eq-cell button.key.eq{
      width:60px;
      height:60px;
      font-size:24px;
    }
    .footnote{padding-bottom:max(8px, env(safe-area-inset-bottom));}
  }
</style>
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme');
    var theme = (saved === 'light' || saved === 'dark') ? saved
      : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
</head>
<body>

<div class="app">
  <div class="tricolor"><span class="a"></span><span class="b"></span><span class="c"></span></div>

  <div class="display">
    <div class="top-row">
      <button class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>
      <span class="status-dot" id="statusDot" title="Conexión"></span>
    </div>

    <div class="history" id="historyBox"></div>
    <div class="expr-line" id="exprLine">&nbsp;</div>
    <div class="digits" id="digits">0</div>

    <!-- Filas de tasas: BCV publicada (la de bcv.org.ve), BCV vigente (la que rige hoy; se oculta
         cuando es la misma que la publicada) y Binance P2P. Las dibuja renderRates(). -->
    <div class="conversions">
      <div class="conv-row" id="rowPub">
        <span class="conv-label"><span class="dot bcv-next"></span><span class="conv-name"><span class="conv-title">BCV</span><span class="conv-sub"></span></span></span>
        <span class="conv-right">
          <button class="rate-reset" title="Volver a la tasa oficial" hidden>↺</button>
          <input class="rate-edit" inputmode="decimal" placeholder="—" aria-label="Tasa BCV publicada">
          <span class="conv-result">Bs 0.00</span>
        </span>
      </div>
      <div class="conv-row" id="rowVig" hidden>
        <span class="conv-label"><span class="dot bcv"></span><span class="conv-name"><span class="conv-title">BCV</span><span class="conv-sub"></span></span></span>
        <span class="conv-right">
          <button class="rate-reset" title="Volver a la tasa oficial" hidden>↺</button>
          <input class="rate-edit" inputmode="decimal" placeholder="—" aria-label="Tasa BCV vigente">
          <span class="conv-result">Bs 0.00</span>
        </span>
      </div>
      <div class="conv-row" id="rowP2p">
        <span class="conv-label"><span class="dot binance"></span><span class="conv-name"><span class="conv-title">Binance P2P</span><span class="conv-sub"></span></span></span>
        <span class="conv-right">
          <button class="rate-reset" title="Volver a la referencia automática" hidden>↺</button>
          <input class="rate-edit" inputmode="decimal" placeholder="—" aria-label="Tasa Binance P2P">
          <span class="conv-result">Bs 0.00</span>
        </span>
      </div>
    </div>

    <div class="update-row">
      <span class="update-info" id="updateInfo">Toca para traer las tasas</span>
      <button class="update-btn" id="refreshBtn"><span class="spin">⟳</span> Actualizar</button>
    </div>
  </div>

  <div class="keypad">
    <button class="key paren" data-k="popen" style="grid-column: span 2;">(</button>
    <button class="key paren" data-k="pclose" style="grid-column: span 2;">)</button>

    <button class="key fn clear" data-k="ac">C</button>
    <button class="key fn" data-k="back">⌫</button>
    <button class="key fn" data-k="pct">%</button>
    <button class="key op" data-k="div">÷</button>

    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key op" data-k="mul">×</button>

    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key op" data-k="sub">−</button>

    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key op" data-k="add">+</button>

    <button class="key mode-key" id="modeBtn">Bs<br>⇄ USD</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k="dot">.</button>
    <div class="key-eq-cell"><button class="key eq" data-k="eq">=</button></div>
  </div>

  <div class="footnote">Toca una tasa para ajustarla · verifica en <a href="https://www.bcv.org.ve/" target="_blank" rel="noopener">bcv.org.ve</a> · <span id="appVersion"></span><button id="updateBadge" class="update-badge" hidden>· Nueva versión, toca para actualizar</button></div>
  <div class="install-row"><button class="install-btn" id="installBtn">Instalar app</button></div>
</div>

<script src="calc.js"></script>
<script src="rates.js"></script>
<script>
(function(){
  "use strict";

  var APP_VERSION = "1.4.0";
  var versionEl = document.getElementById('appVersion');
  if(versionEl) versionEl.textContent = "v" + APP_VERSION;

  var digitsEl = document.getElementById('digits');
  var exprLineEl = document.getElementById('exprLine');
  var historyBox = document.getElementById('historyBox');

  var CE = window.CalcEngine;
  var engine = CE.createEngine();

  function renderHistory(){
    var shown = engine.history.slice(-20);
    var classes = ["op1","op2","op3","op4"];
    historyBox.innerHTML = shown.map(function(h, i){
      var c = i >= shown.length - 4 ? classes[4 - (shown.length - i)] : "op1";
      return '<div class="history-row ' + c + '"><span class="h-expr">' + h.expr + ' =</span>' + h.result + '</div>';
    }).join('');
    historyBox.scrollTop = historyBox.scrollHeight;
  }

  function render(){
    if(engine.justEqualed){
      digitsEl.classList.add('is-result');
      digitsEl.textContent = CE.groupNumber(engine.currentNumber);
      var h = engine.history;
      exprLineEl.textContent = h.length ? (h[h.length-1].expr + " =") : "";
    } else {
      digitsEl.classList.remove('is-result');
      digitsEl.textContent = engine.liveExprString();
      exprLineEl.innerHTML = "&nbsp;";
    }
    renderHistory();
    updateConversions();
  }

  function pressDigit(d){ engine.pressDigit(d); render(); }
  function backspace(){ engine.backspace(); render(); }
  function percent(){ engine.percent(); render(); }
  function clearAll(){ engine.clearAll(); render(); }
  function pressOperator(op){ engine.pressOperator(op); render(); }
  function pressParen(which){ engine.pressParen(which); render(); }
  function equals(){ engine.equals(); render(); }

  var keyMap = {
    ac: clearAll, back: backspace, pct: percent,
    add: function(){ pressOperator("+"); },
    sub: function(){ pressOperator("−"); },
    mul: function(){ pressOperator("×"); },
    div: function(){ pressOperator("÷"); },
    popen: function(){ pressParen("("); },
    pclose: function(){ pressParen(")"); },
    eq: equals,
    dot: function(){ pressDigit("."); }
  };

  document.querySelector('.keypad').addEventListener('click', function(e){
    var btn = e.target.closest('.key');
    if(!btn || btn.id === 'modeBtn') return;
    var k = btn.dataset.k;
    if(/^[0-9]$/.test(k)){ pressDigit(k); return; }
    if(keyMap[k]) keyMap[k]();
  });

  document.addEventListener('keydown', function(e){
    if(/^[0-9]$/.test(e.key)){ pressDigit(e.key); return; }
    if(e.key === "."){ pressDigit("."); return; }
    if(e.key === "+"){ pressOperator("+"); return; }
    if(e.key === "-"){ pressOperator("−"); return; }
    if(e.key === "*"){ pressOperator("×"); return; }
    if(e.key === "/"){ e.preventDefault(); pressOperator("÷"); return; }
    if(e.key === "("){ pressParen("("); return; }
    if(e.key === ")"){ pressParen(")"); return; }
    if(e.key === "Enter" || e.key === "="){ equals(); return; }
    if(e.key === "Escape"){ clearAll(); return; }
    if(e.key === "Backspace"){ backspace(); return; }
  });

  // ---------- Conversión ----------
  var mode = "ves";
  var modeBtn = document.getElementById('modeBtn');

  modeBtn.addEventListener('click', function(){
    mode = mode === "usd" ? "ves" : "usd";
    modeBtn.innerHTML = mode === "usd" ? "USD<br>⇄ Bs" : "Bs<br>⇄ USD";
    updateConversions();
  });

  // ---------- Tasas: estado ----------
  // state.bcv: tasas BCV recientes [{fecha (fecha valor), value}] traídas de dolarapi.
  // state.p2p: referencia automática para la fila P2P {value, source, at}.
  // Los ajustes manuales viven aparte (bcvOverride / p2pOverride): ningún refresco los pisa.
  //  - BCV: se mantiene hasta que el BCV publique una tasa con fecha valor más nueva.
  //  - P2P: se mantiene hasta que se toque ↺.
  var R = window.Rates;
  var STORE_KEY = 'rates.v2';
  var API = 'https://ve.dolarapi.com/v1/';
  var REFRESH_MIN_MS = 60 * 1000; // al volver a la app, como mucho un refresco por minuto
  var state = { bcv: [], p2p: null, fetchedAt: null, bcvOverride: null, p2pOverride: null, legacyBcv: null };

  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function loadState(){
    try{
      var s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if(s && typeof s === 'object'){
        state.bcv = R.normalizeEntries(s.bcv);
        state.p2p = s.p2p && s.p2p.value > 0 ? s.p2p : null;
        state.fetchedAt = typeof s.fetchedAt === 'number' ? s.fetchedAt : null;
        state.bcvOverride = s.bcvOverride && s.bcvOverride.values ? s.bcvOverride : null;
        state.p2pOverride = s.p2pOverride && s.p2pOverride.value > 0 ? s.p2pOverride : null;
        state.legacyBcv = s.legacyBcv > 0 ? s.legacyBcv : null;
        return;
      }
      // Migración desde v1.3 (claves sueltas, sin fecha valor ni distinción manual/automática).
      var oldBcv = CE.parseRate(localStorage.getItem('bcvRate') || '');
      var oldP2p = CE.parseRate(localStorage.getItem('p2pRate') || '');
      var oldFetch = parseInt(localStorage.getItem('lastFetch'), 10);
      if(oldBcv) state.legacyBcv = oldBcv;
      if(oldP2p) state.p2p = { value: oldP2p, source: 'guardado', at: isFinite(oldFetch) ? oldFetch : null };
      saveState();
      ['bcvRate', 'p2pRate', 'lastFetch'].forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
  }

  // ---------- Tasas: filas ----------
  function rowEls(id){
    var el = document.getElementById(id);
    return {
      el: el, dot: el.querySelector('.dot'), title: el.querySelector('.conv-title'),
      sub: el.querySelector('.conv-sub'), input: el.querySelector('.rate-edit'),
      reset: el.querySelector('.rate-reset'), result: el.querySelector('.conv-result')
    };
  }
  var ROW_KEYS = ['pub', 'vig', 'p2p'];
  var rows = { pub: rowEls('rowPub'), vig: rowEls('rowVig'), p2p: rowEls('rowP2p') };
  // Lo que muestra cada fila ahora mismo; lo arma computeModel() y lo usan los eventos.
  var model = { pub: null, vig: null, p2p: null };
  var ctx = null; // {today, pick}

  function computeModel(){
    var today = R.caracasToday(new Date());
    var pick = R.pickBcv(state.bcv, today);
    var pubFecha = pick.published ? pick.published.fecha : null;

    var rec = R.reconcileBcvOverride(state.bcvOverride, pubFecha);
    if(rec.dropped){
      state.bcvOverride = null;
      saveState();
      showNotice('El BCV publicó una tasa nueva: se descartó tu ajuste manual');
    }

    function bcvRow(entry, sub){
      var fecha = entry ? entry.fecha : null;
      var official = entry ? entry.value : state.legacyBcv;
      var manual = R.bcvOverrideFor(state.bcvOverride, fecha);
      return {
        kind: 'bcv', fecha: fecha, pubFecha: pubFecha, official: official || null, manual: manual,
        rate: manual !== null ? manual : (official || 0),
        title: entry ? 'BCV · ' + R.fmtFecha(fecha) : 'BCV',
        sub: manual !== null ? 'manual' + (official ? ' · oficial ' + R.fmtRate(official) : '') : sub
      };
    }

    var pubFuture = !!pick.published && pick.published.fecha > today;
    var pubSub = !pick.published ? (state.legacyBcv ? 'guardada · sin fecha valor' : 'sin datos · toca Actualizar')
      : pubFuture ? 'publicada · aún no rige'
      : 'vigente';
    model.pub = bcvRow(pick.published, pubSub);
    model.pub.future = pubFuture;
    model.vig = pick.same ? null : bcvRow(pick.vigente, 'vigente hoy');

    var auto = state.p2p;
    var p2pManual = state.p2pOverride ? state.p2pOverride.value : null;
    var autoSub = !auto ? 'sin dato · tócala para escribirla'
      : auto.source === 'paralelo' ? 'ref. dolarapi' + (auto.at ? ' · ' + relativeTime(new Date(auto.at)) : '')
      : 'guardada';
    model.p2p = {
      kind: 'p2p', official: auto ? auto.value : null, manual: p2pManual,
      rate: p2pManual !== null ? p2pManual : (auto ? auto.value : 0),
      title: 'Binance P2P',
      sub: p2pManual !== null ? 'manual · ' + relativeTime(new Date(state.p2pOverride.at)) : autoSub
    };

    ctx = { today: today, pick: pick };
  }

  function renderRow(r, m){
    r.el.hidden = !m;
    if(!m) return;
    var isManual = m.manual !== null;
    r.title.textContent = m.title;
    r.sub.textContent = m.sub;
    r.sub.classList.toggle('manual', isManual);
    r.input.classList.toggle('manual', isManual);
    r.reset.hidden = !isManual;
    // Nunca reescribir el campo mientras la persona lo está editando.
    if(document.activeElement !== r.input) r.input.value = R.fmtRate(m.rate);
  }

  function renderRates(){
    computeModel();
    ROW_KEYS.forEach(function(k){ renderRow(rows[k], model[k]); });
    // Punto hueco = publicada que todavía no rige; lleno = la que rige hoy.
    rows.pub.dot.className = 'dot ' + (model.pub.future ? 'bcv-next' : 'bcv');
    updateConversions();
    renderInfo();
  }

  function updateConversions(){
    var amount = engine.currentValue();
    ROW_KEYS.forEach(function(k){
      var m = model[k];
      if(!m) return;
      rows[k].result.textContent = mode === "usd"
        ? CE.fmtVES(amount * m.rate)
        : CE.fmtUSD(m.rate ? amount / m.rate : 0);
    });
  }

  // ---------- Tasas: ajustes manuales ----------
  function setManual(m, value){
    if(m.official && value === m.official){ clearManual(m); return; }
    if(m.kind === 'p2p') state.p2pOverride = { value: value, at: Date.now() };
    else state.bcvOverride = R.setBcvOverride(state.bcvOverride, m.pubFecha, m.fecha, value);
    saveState();
  }

  function clearManual(m){
    if(m.kind === 'p2p') state.p2pOverride = null;
    else state.bcvOverride = R.clearBcvOverride(state.bcvOverride, m.fecha);
    saveState();
  }

  ROW_KEYS.forEach(function(k){
    var r = rows[k];
    r.input.addEventListener('focus', function(){ r.input.select(); });
    r.input.addEventListener('input', function(){
      var m = model[k];
      if(!m) return;
      var v = CE.parseRate(r.input.value);
      if(v > 0) setManual(m, v);
      else clearManual(m); // campo vacío = volver a la tasa oficial
      renderRates();
    });
    r.input.addEventListener('blur', renderRates);
    r.reset.addEventListener('click', function(){
      if(model[k]) clearManual(model[k]);
      renderRates();
    });
  });

  // ---------- Tasas: línea de estado ----------
  var updateInfo = document.getElementById('updateInfo');
  var refreshBtn = document.getElementById('refreshBtn');
  var fetching = false, fetchError = null, lastAttempt = 0;
  var notice = null, noticeUntil = 0;

  function showNotice(text){ notice = text; noticeUntil = Date.now() + 60000; }

  function relativeTime(date){
    var sec = Math.floor((Date.now() - date.getTime()) / 1000);
    if(sec < 45) return "hace un momento";
    var min = Math.floor(sec / 60);
    if(min < 60) return "hace " + Math.max(min, 1) + " min";
    var hr = Math.floor(min / 60);
    if(hr < 24) return "hace " + hr + (hr === 1 ? " hora" : " horas");
    var d = Math.floor(hr / 24);
    return "hace " + d + (d === 1 ? " día" : " días");
  }

  function renderInfo(){
    var text, warn = false;
    var pub = ctx && ctx.pick.published;
    if(fetching) text = "Actualizando…";
    else if(notice && Date.now() < noticeUntil){ text = notice; warn = true; }
    else if(fetchError === 'offline') text = "Sin conexión · usando tasas guardadas";
    else if(fetchError){ text = "No se pudo actualizar · usando tasas guardadas"; warn = true; }
    else if(pub && R.isStale(pub, ctx.today)){ text = "Última tasa BCV: " + R.fmtFecha(pub.fecha) + " · revisa bcv.org.ve"; warn = true; }
    else if(state.fetchedAt) text = "Actualizado " + relativeTime(new Date(state.fetchedAt));
    else text = "Toca para traer las tasas";
    updateInfo.textContent = text;
    updateInfo.classList.toggle('warn', warn);
  }

  // ---------- Tasas: descarga ----------
  function fetchWithTimeout(url, opts, ms){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, ms);
    opts = Object.assign({}, opts, {signal: controller.signal});
    return fetch(url, opts).finally(function(){ clearTimeout(timer); });
  }

  function getJSON(url){
    return fetchWithTimeout(url, { cache: 'no-store' }, 8000).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  // historicos trae la serie BCV con su fecha valor, incluida la ya publicada para el próximo
  // día hábil (/dolares/oficial solo devuelve la vigente). /dolares trae además el paralelo.
  // Binance P2P no se consulta directo: su API no permite CORS desde el navegador.
  async function fetchRates(){
    if(fetching) return;
    lastAttempt = Date.now();
    if(!navigator.onLine){ fetchError = 'offline'; renderInfo(); return; }
    fetching = true;
    fetchError = null;
    refreshBtn.classList.add('loading');
    renderInfo();

    var res = await Promise.allSettled([
      getJSON(API + 'historicos/dolares/oficial'),
      getJSON(API + 'dolares')
    ]);
    var hist = res[0].status === 'fulfilled' ? R.parseHistoricos(res[0].value) : [];
    var dol = res[1].status === 'fulfilled' ? R.parseDolares(res[1].value) : { oficial: null, paralelo: null };

    var ok = false;
    if(hist.length){
      state.bcv = R.normalizeEntries(hist.concat(dol.oficial ? [dol.oficial] : []));
      ok = true;
    } else if(dol.oficial){
      state.bcv = R.normalizeEntries(state.bcv.concat([dol.oficial]));
      ok = true;
    }
    if(dol.paralelo){
      state.p2p = { value: dol.paralelo.value, source: 'paralelo', at: dol.paralelo.at || Date.now() };
      ok = true;
    }
    if(ok){
      state.fetchedAt = Date.now();
      if(state.bcv.length) state.legacyBcv = null;
      saveState();
    } else {
      fetchError = 'fail';
    }

    fetching = false;
    refreshBtn.classList.remove('loading');
    renderRates();
  }

  refreshBtn.addEventListener('click', fetchRates);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    renderRates(); // si cambió el día, la publicada pasa a vigente aun sin red
    if(Date.now() - lastAttempt > REFRESH_MIN_MS) fetchRates();
  });
  window.addEventListener('online', fetchRates);
  setInterval(function(){
    if(document.visibilityState === 'visible') renderRates();
  }, 30000);

  loadState();
  renderRates();
  render();
  fetchRates();

  // ---------- Theme toggle ----------
  var themeToggle = document.getElementById('themeToggle');
  var themeColorMeta = document.querySelector('meta[name="theme-color"]');
  var THEME_COLORS = { dark: "#0b0c0e", light: "#f2f2f0" };

  function applyThemeUI(){
    var theme = document.documentElement.getAttribute('data-theme') || 'dark';
    themeColorMeta.setAttribute('content', THEME_COLORS[theme]);
    themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
    themeToggle.title = theme === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro';
  }
  applyThemeUI();

  themeToggle.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
    applyThemeUI();
  });

  // ---------- PWA: online/offline status ----------
  var statusDot = document.getElementById('statusDot');
  function updateStatus(){
    statusDot.classList.toggle('offline', !navigator.onLine);
    statusDot.title = navigator.onLine ? 'En línea' : 'Sin conexión (modo offline)';
  }
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);
  updateStatus();

  // ---------- PWA: service worker registration + update banner ----------
  var updateBadge = document.getElementById('updateBadge');

  if('serviceWorker' in navigator){
    // sw.js llama a skipWaiting()/clients.claim() apenas instala, así que un
    // "controllerchange" que no sea el primero (esta pestaña ya tenía un SW
    // activo antes) significa que una versión nueva acaba de tomar control.
    var hadController = !!navigator.serviceWorker.controller;
    var swRegistration = null;

    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(hadController && updateBadge) updateBadge.hidden = false;
      hadController = true;
    });

    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        swRegistration = reg;
      }).catch(function(){ /* offline no disponible en este navegador/origen */ });
    });

    // El navegador solo revisa sw.js por su cuenta en momentos puntuales;
    // forzamos la revisión al volver a la pestaña y cada 5 minutos abierta.
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'visible' && swRegistration){
        swRegistration.update().catch(function(){});
      }
    });
    setInterval(function(){
      if(swRegistration) swRegistration.update().catch(function(){});
    }, 5 * 60 * 1000);
  }

  if(updateBadge){
    updateBadge.addEventListener('click', function(){
      location.reload();
    });
  }

  // ---------- PWA: install prompt ----------
  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });

  installBtn.addEventListener('click', async function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.classList.remove('show');
  });

  window.addEventListener('appinstalled', function(){
    installBtn.classList.remove('show');
  });
})();
</script>

</body>
</html>
