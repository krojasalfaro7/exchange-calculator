<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Sin viewport-fit=cover a propósito: en Android, Chrome 135+ con cover dibuja la página detrás
     de la barra de navegación del sistema y, tras recargar (p. ej. «Actualizar ahora»), la barra de
     abajo quedaba tapada hasta salir y volver a entrar. En iOS sí hace falta (barra de estado
     translúcida) y lo agrega el script del <head>. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Calculadora BCV · Binance P2P</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c0e">
<meta name="background-color" content="#0b0c0e">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Calculadora lite con conversión en vivo a tasa BCV y Binance P2P">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc Bs">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- Android / Chrome -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<style>
  /* Modo oscuro: fondo casi negro (igual al theme-color) y superficies sólidas un par de pasos
     más claras, para que las filas de tasas y las teclas se distingan; grises secundarios con
     contraste ≥ 4.5:1 (antes las filas eran 3 % de blanco sobre negro puro). */
  :root{
    --bg:#0b0c0e;
    --panel:#0b0c0e;
    --key:#1d1f23;
    --accent:#ff7a3d;
    --text:#f5f5f2;
    --muted:#a4a8af;
    --history:#7f838a;
    --bcv:#6fa8cf;
    --binance:#f0b90b;
    --border:rgba(255,255,255,.12);
    --hairline:rgba(255,255,255,.38);
    --row-bg:#1a1c20;
    --btn-bg:#2c2f35;
    --shadow:rgba(0,0,0,.6);
    --gap:#0b0c0e;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f2f2f0;
    --panel:#f2f2f0;
    --key:#e9e9e6;
    --accent:#e35a1c;
    --text:#17181c;
    --muted:#6b6f76;
    --history:#9a9da3;
    --border:rgba(0,0,0,.08);
    --hairline:rgba(0,0,0,.25);
    --row-bg:rgba(0,0,0,.04);
    --btn-bg:rgba(0,0,0,.07);
    --shadow:rgba(0,0,0,.15);
    --gap:#e2e2df;
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Sin alto fijo ni overflow:hidden: si algo no cabe, la página se desliza en vez de esconderlo.
     overscroll-behavior-y evita el pull-to-refresh de Chrome. */
  html,body{overscroll-behavior-y:none;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:16px;
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
    overscroll-behavior:none;
  }
  .app{
    width:100%;
    max-width:360px;
    background:var(--panel);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 20px 50px var(--shadow);
    border:1px solid var(--border);
  }
  .display{padding:12px 20px 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .history{
    display:flex;
    flex-direction:column;
    gap:2px;
    text-align:right;
    max-height:64px;
    overflow-y:auto;
    scrollbar-width:none;
  }
  .history::-webkit-scrollbar{display:none;}
  .history-row{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:13px;
    color:var(--history);
    white-space:nowrap;
    flex-shrink:0;
  }
  .history-row .h-expr{margin-right:6px;}
  .history-row.op1{opacity:.35;}
  .history-row.op2{opacity:.5;}
  .history-row.op3{opacity:.65;}
  .history-row.op4{opacity:.8;}

  .expr-line{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:16px;
    color:var(--muted);
    text-align:right;
    min-height:20px;
    letter-spacing:.3px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
  }
  .expr-line::-webkit-scrollbar{display:none;}

  .digits{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-weight:500;
    text-align:right;
    line-height:1.15;
    letter-spacing:.5px;
    min-height:52px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
    margin-top:2px;
    font-size:34px;
    transition:font-size .08s ease;
  }
  .digits.is-result{ font-size:44px; }
  .digits::-webkit-scrollbar{display:none;}

  .conversions{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
  .conv-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    background:var(--row-bg);
    border-radius:10px;
    padding:7px 10px;
  }
  .conv-row[hidden]{display:none;}
  .conv-label{display:flex; align-items:center; gap:7px; min-width:0;}
  .conv-name{display:flex; flex-direction:column; line-height:1.25; min-width:0;}
  .conv-title{white-space:nowrap;}
  .conv-sub{font-size:10px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .conv-sub.manual{color:var(--accent); opacity:1;}
  .conv-right{display:flex; align-items:center; flex-shrink:0;}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .dot.bcv{background:var(--bcv);}
  .dot.bcv-next{background:transparent; box-shadow:inset 0 0 0 1.5px var(--bcv);}
  .dot.binance{background:var(--binance);}
  .rate-edit{
    background:none;
    border:none;
    border-bottom:1px dashed var(--hairline);
    color:var(--text);
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:12.5px;
    width:72px;
    text-align:right;
    padding:0 0 1px;
  }
  .rate-edit:focus{outline:none; border-bottom-color:var(--text);}
  .rate-edit.manual{color:var(--accent); border-bottom-color:var(--accent);}
  .rate-reset{
    background:none;
    border:none;
    color:var(--accent);
    font-size:15px;
    line-height:1;
    padding:2px 6px;
    cursor:pointer;
  }
  .rate-reset[hidden]{display:none;}
  .update-info.warn{color:var(--accent);}
  .conv-result{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    color:var(--text);
    font-size:14px;
    font-weight:600;
    margin-left:8px;
  }

  /* Estado de las tasas en la barra de abajo: todo el texto es el botón de refrescar. */
  .update-btn{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--muted);
    font-family:inherit;
    font-size:11px;
    cursor:pointer;
    padding:6px 4px;
    border-radius:8px;
  }
  .update-btn .spin{display:inline-block; color:var(--accent); font-size:14px; line-height:1; font-weight:700;}
  .update-btn.loading .spin{animation:spin 0.9s linear infinite;}
  .update-info{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .keypad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--gap);
    padding-top:1px;
  }
  button.key{
    border:none;
    background:var(--key);
    color:var(--text);
    font-size:24px;
    font-weight:400;
    padding:16px 0;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
  }
  button.key:active{filter:brightness(1.5);}
  button.key.op{color:var(--accent); font-weight:500; font-size:22px;}
  /* Los paréntesis se usan poco: fila más baja (≈60 %) para dejarle espacio a las tasas. */
  button.key.paren{color:var(--accent); font-weight:500; font-size:18px; padding:8px 0;}
  button.key.fn{color:var(--accent); font-size:20px;}
  button.key.fn.clear{font-weight:700;}
  button.key.mode-key{
    color:var(--text);
    font-size:12px;
    font-weight:700;
    letter-spacing:.2px;
  }
  .key-eq-cell{display:flex; align-items:center; justify-content:center; background:var(--key);}
  button.key.eq{
    background:var(--accent);
    color:#1a0e00;
    font-weight:700;
    font-size:22px;
    width:52px;
    height:52px;
    border-radius:50%;
    padding:0;
  }

  /* Barra inferior: tema + ayuda + versión/actualizar, todo en una línea */
  .bottom-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    color:var(--muted);
    font-size:10.5px;
  }
  .sheet-hint{margin:0; font-size:11.5px; line-height:1.4; color:var(--muted); text-align:center;}
  .sheet-hint a{color:inherit;}
  .icon-btn, .app-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    gap:5px;
    padding:6px;
    border-radius:8px;
    flex-shrink:0;
  }
  .icon-btn svg, .app-btn svg{display:block;}
  .app-btn{font-size:10.5px;}
  .app-btn .badge{display:none; width:7px; height:7px; border-radius:50%; background:var(--accent);}
  .app-btn.has-update{color:var(--accent); font-weight:700;}
  .app-btn.has-update .badge{display:block;}

  /* Modal de actualizar la app */
  dialog.sheet{
    border:none;
    border-radius:18px;
    padding:0;
    width:min(320px, calc(100vw - 32px));
    background:var(--key);
    color:var(--text);
    box-shadow:0 20px 50px var(--shadow);
  }
  dialog.sheet::backdrop{background:rgba(0,0,0,.55);}
  .sheet-body{display:flex; flex-direction:column; gap:10px; padding:20px;}
  .sheet-body h2{margin:0 0 4px; font-size:17px;}
  .sheet-row{display:flex; justify-content:space-between; margin:0; font-size:13px; color:var(--muted);}
  .sheet-row strong{color:var(--text); font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;}
  .sheet-status{margin:2px 0 4px; font-size:12.5px; line-height:1.4; color:var(--muted);}
  .sheet-status.ok{color:#3ac16a;}
  .sheet-status.new{color:var(--accent); font-weight:600;}
  .sheet-btn{
    border:none;
    border-radius:12px;
    padding:12px 0;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    background:var(--btn-bg);
    color:var(--text);
  }
  .sheet-btn.primary{background:var(--accent); color:#1a0e00;}
  .sheet-btn:disabled{opacity:.6; cursor:default;}
  .sheet-btn[hidden]{display:none;}

  /* Teléfono: el diseño NO depende del alto de la ventana. Tras «Actualizar ahora» (reload) Android
     reportaba un alto mayor que el visible y, como la app se estiraba a ese alto, la barra de abajo
     quedaba fuera. Ahora todo mide según el ANCHO (que siempre llega bien): las teclas tienen alto
     propio, la barra va a continuación del teclado y, si no cabe, la página se desliza. El
     historial reserva sus 3 líneas para que las teclas no cambien de sitio al calcular. */
  @media (max-width:480px){
    body{
      display:block;
      min-height:0;
      padding:0;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .app{
      max-width:none;
      width:100%;
      border-radius:0;
      box-shadow:none;
      border:none;
    }
    .history{height:64px;}
    .keypad{
      --key-h:clamp(52px, 18vw, 76px);
      grid-template-rows:calc(var(--key-h) * .6) repeat(5, var(--key-h));
    }
    button.key{
      height:100%;
      padding:0;
      font-size:26px;
    }
    button.key.op{font-size:24px;}
    button.key.paren{font-size:20px; padding:0; line-height:1;}
    .key-eq-cell button.key.eq{
      width:auto;
      height:min(60px, calc(100% - 6px));
      aspect-ratio:1;
      font-size:24px;
    }
  }
</style>
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme');
    var theme = (saved === 'light' || saved === 'dark') ? saved
      : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
  // viewport-fit=cover solo en iOS (ver el comentario del <meta name="viewport">).
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var vpMeta = document.querySelector('meta[name="viewport"]');
  if(isIOS && vpMeta) vpMeta.setAttribute('content', vpMeta.getAttribute('content') + ', viewport-fit=cover');
})();
</script>
</head>
<body>

<div class="app">
  <div class="display">
    <div class="history" id="historyBox"></div>
    <div class="expr-line" id="exprLine">&nbsp;</div>
    <div class="digits" id="digits">0</div>

    <!-- Filas de tasas: BCV publicada (la de bcv.org.ve), BCV vigente (la que rige hoy; se oculta
         cuando es la misma que la publicada) y Binance P2P. Las dibuja renderRates(). -->
    <div class="conversions">
      <div class="conv-row" id="rowPub">
        <span class="conv-label"><span class="dot bcv-next"></span><span class="conv-name"><span class="conv-title">BCV</span><span class="conv-sub"></span></span></span>
        <span class="conv-right">
          <button class="rate-reset" title="Volver a la tasa oficial" hidden>↺</button>
          <input class="rate-edit" inputmode="decimal" placeholder="—" aria-label="Tasa BCV publicada">
          <span class="conv-result">Bs 0.00</span>
        </span>
      </div>
      <div class="conv-row" id="rowVig" hidden>
        <span class="conv-label"><span class="dot bcv"></span><span class="conv-name"><span class="conv-title">BCV</span><span class="conv-sub"></span></span></span>
        <span class="conv-right">
          <button class="rate-reset" title="Volver a la tasa oficial" hidden>↺</button>
          <input class="rate-edit" inputmode="decimal" placeholder="—" aria-label="Tasa BCV vigente">
          <span class="conv-result">Bs 0.00</span>
        </span>
      </div>
      <div class="conv-row" id="rowP2p">
        <span class="conv-label"><span class="dot binance"></span><span class="conv-name"><span class="conv-title">Binance P2P</span><span class="conv-sub"></span></span></span>
        <span class="conv-right">
          <button class="rate-reset" title="Volver a la referencia automática" hidden>↺</button>
          <input class="rate-edit" inputmode="decimal" placeholder="—" aria-label="Tasa Binance P2P">
          <span class="conv-result">Bs 0.00</span>
        </span>
      </div>
    </div>
  </div>

  <div class="keypad">
    <button class="key paren" data-k="popen" style="grid-column: span 2;">(</button>
    <button class="key paren" data-k="pclose" style="grid-column: span 2;">)</button>

    <button class="key fn clear" data-k="ac">C</button>
    <button class="key fn" data-k="back">⌫</button>
    <button class="key fn" data-k="pct">%</button>
    <button class="key op" data-k="div">÷</button>

    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key op" data-k="mul">×</button>

    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key op" data-k="sub">−</button>

    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key op" data-k="add">+</button>

    <button class="key mode-key" id="modeBtn">Bs<br>⇄ USD</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k="dot">.</button>
    <div class="key-eq-cell"><button class="key eq" data-k="eq">=</button></div>
  </div>

  <div class="bottom-bar">
    <button class="icon-btn" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg>
    </button>
    <!-- Estado de las tasas; tocarlo las vuelve a traer. La versión de la app va aparte, sin el
         ícono de refrescar, para que no se confundan los dos «actualizar». -->
    <button class="update-btn" id="refreshBtn" title="Actualizar las tasas">
      <span class="spin" aria-hidden="true">⟳</span><span class="update-info" id="updateInfo">Toca para traer las tasas</span>
    </button>
    <button class="app-btn" id="appBtn" title="Versión de la app" aria-haspopup="dialog">
      <span class="badge" aria-hidden="true"></span>
      <span id="appBtnLabel"></span>
    </button>
  </div>
</div>

<dialog class="sheet" id="appDialog" aria-labelledby="appDialogTitle">
  <form method="dialog" class="sheet-body">
    <h2 id="appDialogTitle">Actualizar la app</h2>
    <p class="sheet-row"><span>Instalada</span><strong id="dlgCurrent"></strong></p>
    <p class="sheet-row"><span>Publicada</span><strong id="dlgLatest">—</strong></p>
    <p class="sheet-status" id="dlgStatus"></p>
    <button type="button" class="sheet-btn primary" id="dlgUpdate">Actualizar ahora</button>
    <button type="button" class="sheet-btn" id="installBtn" hidden>Instalar en este dispositivo</button>
    <button type="submit" class="sheet-btn" value="close" id="dlgClose">Cerrar</button>
    <p class="sheet-hint">Toca una tasa para ajustarla a mano · fuente oficial: <a href="https://www.bcv.org.ve/" target="_blank" rel="noopener">bcv.org.ve</a></p>
  </form>
</dialog>

<script src="calc.js"></script>
<script src="rates.js"></script>
<script>
(function(){
  "use strict";

  var APP_VERSION = "1.9.0";

  var digitsEl = document.getElementById('digits');
  var exprLineEl = document.getElementById('exprLine');
  var historyBox = document.getElementById('historyBox');

  var CE = window.CalcEngine;
  var engine = CE.createEngine();

  function renderHistory(){
    var shown = engine.history.slice(-20);
    var classes = ["op1","op2","op3","op4"];
    historyBox.innerHTML = shown.map(function(h, i){
      var c = i >= shown.length - 4 ? classes[4 - (shown.length - i)] : "op1";
      return '<div class="history-row ' + c + '"><span class="h-expr">' + h.expr + ' =</span>' + h.result + '</div>';
    }).join('');
    historyBox.scrollTop = historyBox.scrollHeight;
  }

  function render(){
    if(engine.justEqualed){
      digitsEl.classList.add('is-result');
      digitsEl.textContent = CE.groupNumber(engine.currentNumber);
      var h = engine.history;
      exprLineEl.textContent = h.length ? (h[h.length-1].expr + " =") : "";
    } else {
      digitsEl.classList.remove('is-result');
      digitsEl.textContent = engine.liveExprString();
      exprLineEl.innerHTML = "&nbsp;";
    }
    renderHistory();
    updateConversions();
  }

  function pressDigit(d){ engine.pressDigit(d); render(); }
  function backspace(){ engine.backspace(); render(); }
  function percent(){ engine.percent(); render(); }
  function clearAll(){ engine.clearAll(); render(); }
  function pressOperator(op){ engine.pressOperator(op); render(); }
  function pressParen(which){ engine.pressParen(which); render(); }
  function equals(){ engine.equals(); render(); }

  var keyMap = {
    ac: clearAll, back: backspace, pct: percent,
    add: function(){ pressOperator("+"); },
    sub: function(){ pressOperator("−"); },
    mul: function(){ pressOperator("×"); },
    div: function(){ pressOperator("÷"); },
    popen: function(){ pressParen("("); },
    pclose: function(){ pressParen(")"); },
    eq: equals,
    dot: function(){ pressDigit("."); }
  };

  document.querySelector('.keypad').addEventListener('click', function(e){
    var btn = e.target.closest('.key');
    if(!btn || btn.id === 'modeBtn') return;
    var k = btn.dataset.k;
    if(/^[0-9]$/.test(k)){ pressDigit(k); return; }
    if(keyMap[k]) keyMap[k]();
  });

  document.addEventListener('keydown', function(e){
    // El teclado físico es para la calculadora, no cuando se escribe una tasa o está abierto el modal.
    if(e.target.closest && e.target.closest('input, dialog')) return;
    if(/^[0-9]$/.test(e.key)){ pressDigit(e.key); return; }
    if(e.key === "."){ pressDigit("."); return; }
    if(e.key === "+"){ pressOperator("+"); return; }
    if(e.key === "-"){ pressOperator("−"); return; }
    if(e.key === "*"){ pressOperator("×"); return; }
    if(e.key === "/"){ e.preventDefault(); pressOperator("÷"); return; }
    if(e.key === "("){ pressParen("("); return; }
    if(e.key === ")"){ pressParen(")"); return; }
    if(e.key === "Enter" || e.key === "="){ equals(); return; }
    if(e.key === "Escape"){ clearAll(); return; }
    if(e.key === "Backspace"){ backspace(); return; }
  });

  // ---------- Conversión ----------
  var mode = "ves";
  var modeBtn = document.getElementById('modeBtn');

  modeBtn.addEventListener('click', function(){
    mode = mode === "usd" ? "ves" : "usd";
    modeBtn.innerHTML = mode === "usd" ? "USD<br>⇄ Bs" : "Bs<br>⇄ USD";
    updateConversions();
  });

  // ---------- Tasas: estado ----------
  // state.bcv: tasas BCV recientes [{fecha (fecha valor), value}] traídas de dolarapi.
  // state.p2p: referencia automática para la fila P2P {value, source, at}.
  // Los ajustes manuales viven aparte (bcvOverride / p2pOverride): ningún refresco los pisa.
  //  - BCV: se mantiene hasta que el BCV publique una tasa con fecha valor más nueva.
  //  - P2P: se mantiene hasta que se toque ↺.
  var R = window.Rates;
  var STORE_KEY = 'rates.v2';
  var API = 'https://ve.dolarapi.com/v1/';
  var REFRESH_MIN_MS = 60 * 1000; // al volver a la app, como mucho un refresco por minuto
  var state = { bcv: [], p2p: null, fetchedAt: null, bcvOverride: null, p2pOverride: null, legacyBcv: null };

  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function loadState(){
    try{
      var s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if(s && typeof s === 'object'){
        state.bcv = R.normalizeEntries(s.bcv);
        state.p2p = s.p2p && s.p2p.value > 0 ? s.p2p : null;
        state.fetchedAt = typeof s.fetchedAt === 'number' ? s.fetchedAt : null;
        state.bcvOverride = s.bcvOverride && s.bcvOverride.values ? s.bcvOverride : null;
        state.p2pOverride = s.p2pOverride && s.p2pOverride.value > 0 ? s.p2pOverride : null;
        state.legacyBcv = s.legacyBcv > 0 ? s.legacyBcv : null;
        return;
      }
      // Migración desde v1.3 (claves sueltas, sin fecha valor ni distinción manual/automática).
      var oldBcv = CE.parseRate(localStorage.getItem('bcvRate') || '');
      var oldP2p = CE.parseRate(localStorage.getItem('p2pRate') || '');
      var oldFetch = parseInt(localStorage.getItem('lastFetch'), 10);
      if(oldBcv) state.legacyBcv = oldBcv;
      if(oldP2p) state.p2p = { value: oldP2p, source: 'guardado', at: isFinite(oldFetch) ? oldFetch : null };
      saveState();
      ['bcvRate', 'p2pRate', 'lastFetch'].forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
  }

  // ---------- Tasas: filas ----------
  function rowEls(id){
    var el = document.getElementById(id);
    return {
      el: el, dot: el.querySelector('.dot'), title: el.querySelector('.conv-title'),
      sub: el.querySelector('.conv-sub'), input: el.querySelector('.rate-edit'),
      reset: el.querySelector('.rate-reset'), result: el.querySelector('.conv-result')
    };
  }
  var ROW_KEYS = ['pub', 'vig', 'p2p'];
  var rows = { pub: rowEls('rowPub'), vig: rowEls('rowVig'), p2p: rowEls('rowP2p') };
  // Lo que muestra cada fila ahora mismo; lo arma computeModel() y lo usan los eventos.
  var model = { pub: null, vig: null, p2p: null };
  var ctx = null; // {today, pick}

  function computeModel(){
    var today = R.caracasToday(new Date());
    var pick = R.pickBcv(state.bcv, today);
    var pubFecha = pick.published ? pick.published.fecha : null;

    var rec = R.reconcileBcvOverride(state.bcvOverride, pubFecha);
    if(rec.dropped){
      state.bcvOverride = null;
      saveState();
      showNotice('Tasa BCV nueva: se quitó tu ajuste');
    }

    function bcvRow(entry, sub){
      var fecha = entry ? entry.fecha : null;
      var official = entry ? entry.value : state.legacyBcv;
      var manual = R.bcvOverrideFor(state.bcvOverride, fecha);
      return {
        kind: 'bcv', fecha: fecha, pubFecha: pubFecha, official: official || null, manual: manual,
        rate: manual !== null ? manual : (official || 0),
        title: entry ? 'BCV · ' + R.fmtFecha(fecha) : 'BCV',
        sub: manual !== null ? 'manual' + (official ? ' · oficial ' + R.fmtRate(official) : '') : sub
      };
    }

    var pubFuture = !!pick.published && pick.published.fecha > today;
    var pubSub = !pick.published ? (state.legacyBcv ? 'guardada · sin fecha valor' : 'sin datos · toca Actualizar')
      : pubFuture ? 'publicada · aún no rige'
      : 'vigente';
    model.pub = bcvRow(pick.published, pubSub);
    model.pub.future = pubFuture;
    model.vig = pick.same ? null : bcvRow(pick.vigente, 'vigente hoy');

    var auto = state.p2p;
    var p2pManual = state.p2pOverride ? state.p2pOverride.value : null;
    var autoSub = !auto ? 'sin dato · tócala para escribirla'
      : auto.source === 'binance' ? 'Binance · ' + relativeTime(new Date(auto.at))
      : auto.source === 'paralelo' ? 'ref. dolarapi' + (auto.at ? ' · ' + relativeTime(new Date(auto.at)) : '')
      : 'guardada';
    model.p2p = {
      kind: 'p2p', official: auto ? auto.value : null, manual: p2pManual,
      rate: p2pManual !== null ? p2pManual : (auto ? auto.value : 0),
      title: 'Binance P2P',
      sub: p2pManual !== null ? 'manual · ' + relativeTime(new Date(state.p2pOverride.at)) : autoSub
    };

    ctx = { today: today, pick: pick };
  }

  function renderRow(r, m){
    r.el.hidden = !m;
    if(!m) return;
    var isManual = m.manual !== null;
    r.title.textContent = m.title;
    r.sub.textContent = m.sub;
    r.sub.classList.toggle('manual', isManual);
    r.input.classList.toggle('manual', isManual);
    r.reset.hidden = !isManual;
    // Nunca reescribir el campo mientras la persona lo está editando.
    if(document.activeElement !== r.input) r.input.value = R.fmtRate(m.rate);
  }

  function renderRates(){
    computeModel();
    ROW_KEYS.forEach(function(k){ renderRow(rows[k], model[k]); });
    // Punto hueco = publicada que todavía no rige; lleno = la que rige hoy.
    rows.pub.dot.className = 'dot ' + (model.pub.future ? 'bcv-next' : 'bcv');
    updateConversions();
    renderInfo();
  }

  function updateConversions(){
    var amount = engine.currentValue();
    ROW_KEYS.forEach(function(k){
      var m = model[k];
      if(!m) return;
      rows[k].result.textContent = mode === "usd"
        ? CE.fmtVES(amount * m.rate)
        : CE.fmtUSD(m.rate ? amount / m.rate : 0);
    });
  }

  // ---------- Tasas: ajustes manuales ----------
  function setManual(m, value){
    if(m.official && value === m.official){ clearManual(m); return; }
    if(m.kind === 'p2p') state.p2pOverride = { value: value, at: Date.now() };
    else state.bcvOverride = R.setBcvOverride(state.bcvOverride, m.pubFecha, m.fecha, value);
    saveState();
  }

  function clearManual(m){
    if(m.kind === 'p2p') state.p2pOverride = null;
    else state.bcvOverride = R.clearBcvOverride(state.bcvOverride, m.fecha);
    saveState();
  }

  ROW_KEYS.forEach(function(k){
    var r = rows[k];
    r.input.addEventListener('focus', function(){ r.input.select(); });
    r.input.addEventListener('input', function(){
      var m = model[k];
      if(!m) return;
      var v = CE.parseRate(r.input.value);
      if(v > 0) setManual(m, v);
      else clearManual(m); // campo vacío = volver a la tasa oficial
      renderRates();
    });
    r.input.addEventListener('blur', renderRates);
    r.reset.addEventListener('click', function(){
      if(model[k]) clearManual(model[k]);
      renderRates();
    });
  });

  // ---------- Tasas: línea de estado ----------
  var updateInfo = document.getElementById('updateInfo');
  var refreshBtn = document.getElementById('refreshBtn');
  var fetching = false, fetchError = null, lastAttempt = 0;
  var notice = null, noticeUntil = 0;

  function showNotice(text){ notice = text; noticeUntil = Date.now() + 60000; }

  function relativeTime(date){
    var sec = Math.floor((Date.now() - date.getTime()) / 1000);
    if(sec < 45) return "hace un momento";
    var min = Math.floor(sec / 60);
    if(min < 60) return "hace " + Math.max(min, 1) + " min";
    var hr = Math.floor(min / 60);
    if(hr < 24) return "hace " + hr + (hr === 1 ? " hora" : " horas");
    var d = Math.floor(hr / 24);
    return "hace " + d + (d === 1 ? " día" : " días");
  }

  function renderInfo(){
    var text, warn = false;
    var pub = ctx && ctx.pick.published;
    if(fetching) text = "Actualizando…";
    else if(notice && Date.now() < noticeUntil){ text = notice; warn = true; }
    else if(fetchError === 'offline' || !navigator.onLine) text = "Sin conexión · tasas guardadas";
    else if(fetchError){ text = "No se pudo actualizar · tasas guardadas"; warn = true; }
    else if(pub && R.isStale(pub, ctx.today)){ text = "BCV del " + R.fmtFecha(pub.fecha) + " · revisa bcv.org.ve"; warn = true; }
    else if(state.fetchedAt) text = "Actualizado " + relativeTime(new Date(state.fetchedAt));
    else text = "Toca para traer las tasas";
    updateInfo.textContent = text;
    refreshBtn.title = text + " · toca para actualizar las tasas";
    updateInfo.classList.toggle('warn', warn);
  }

  // ---------- Tasas: descarga ----------
  function fetchWithTimeout(url, opts, ms){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, ms);
    opts = Object.assign({}, opts, {signal: controller.signal});
    return fetch(url, opts).finally(function(){ clearTimeout(timer); });
  }

  function getJSON(url){
    return fetchWithTimeout(url, { cache: 'no-store' }, 8000).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  // Fuentes, todas en paralelo:
  //  - rates.json (mismo dominio): lo genera la Action leyendo bcv.org.ve y Binance P2P desde el
  //    servidor (Binance no permite CORS desde el navegador). No existe al probar en local.
  //  - dolarapi historicos: serie BCV con fecha valor, incluida la ya publicada para el próximo día
  //    hábil (/dolares/oficial solo devuelve la vigente). Respaldo si la Action se atrasa.
  //  - dolarapi /dolares: oficial vigente + paralelo (respaldo de P2P).
  async function fetchRates(){
    if(fetching) return;
    lastAttempt = Date.now();
    if(!navigator.onLine){ fetchError = 'offline'; renderInfo(); return; }
    fetching = true;
    fetchError = null;
    refreshBtn.classList.add('loading');
    renderInfo();

    var res = await Promise.allSettled([
      getJSON('rates.json'),
      getJSON(API + 'historicos/dolares/oficial'),
      getJSON(API + 'dolares')
    ]);
    var own = R.parseOwnRates(res[0].status === 'fulfilled' ? res[0].value : null);
    var hist = res[1].status === 'fulfilled' ? R.parseHistoricos(res[1].value) : [];
    var dol = res[2].status === 'fulfilled' ? R.parseDolares(res[2].value) : { oficial: null, paralelo: null };

    var ok = false;
    var freshBcv = hist.concat(dol.oficial ? [dol.oficial] : [], own.bcv);
    if(freshBcv.length){
      // Misma fecha valor en varias fuentes: gana la última de la lista, la leída de bcv.org.ve.
      state.bcv = R.normalizeEntries(state.bcv.concat(freshBcv));
      ok = true;
    }
    var paralelo = dol.paralelo ? { value: dol.paralelo.value, source: 'paralelo', at: dol.paralelo.at || Date.now() } : null;
    var binance = own.p2p || (state.p2p && state.p2p.source === 'binance' ? state.p2p : null);
    if(own.p2p || paralelo){
      state.p2p = R.pickP2p(binance, paralelo, Date.now());
      ok = true;
    }
    if(ok){
      state.fetchedAt = Date.now();
      if(state.bcv.length) state.legacyBcv = null;
      saveState();
    } else {
      fetchError = 'fail';
    }

    fetching = false;
    refreshBtn.classList.remove('loading');
    renderRates();
  }

  refreshBtn.addEventListener('click', fetchRates);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    renderRates(); // si cambió el día, la publicada pasa a vigente aun sin red
    if(Date.now() - lastAttempt > REFRESH_MIN_MS) fetchRates();
  });
  window.addEventListener('online', fetchRates);
  window.addEventListener('offline', renderInfo);
  setInterval(function(){
    if(document.visibilityState === 'visible') renderRates();
  }, 30000);

  loadState();
  renderRates();
  render();
  fetchRates();

  // ---------- Tema ----------
  var themeToggle = document.getElementById('themeToggle');
  var themeColorMeta = document.querySelector('meta[name="theme-color"]');
  var THEME_COLORS = { dark: "#0b0c0e", light: "#f2f2f0" };

  function applyThemeUI(){
    var theme = document.documentElement.getAttribute('data-theme') || 'dark';
    themeColorMeta.setAttribute('content', THEME_COLORS[theme]);
    themeToggle.title = theme === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro';
    themeToggle.setAttribute('aria-label', themeToggle.title);
  }
  applyThemeUI();

  themeToggle.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
    applyThemeUI();
  });

  // ---------- Actualizar la app (PWA) ----------
  // Dos señales de versión nueva:
  //  1. La versión publicada: se lee APP_VERSION del index.html del servidor (?fresh= hace que el
  //     SW no lo sirva de su cache) al abrir el modal, al volver a la app (cada 10 min como mucho)
  //     y cada 30 min con la app abierta.
  //  2. "controllerchange": sw.js hace skipWaiting()/clients.claim(), así que un cambio de
  //     controlador que no sea el primero significa que un SW nuevo ya tomó el control.
  // "Actualizar ahora" fuerza todo: SW nuevo, borra los caches, vuelve a bajar el app shell
  // saltándose el cache HTTP y recarga. También sirve para "reparar" una instalación trabada.
  var appBtn = document.getElementById('appBtn');
  var appBtnLabel = document.getElementById('appBtnLabel');
  var appDialog = document.getElementById('appDialog');
  var dlgCurrent = document.getElementById('dlgCurrent');
  var dlgLatest = document.getElementById('dlgLatest');
  var dlgStatus = document.getElementById('dlgStatus');
  var dlgUpdate = document.getElementById('dlgUpdate');
  var SHELL_FILES = ['./', './index.html', './calc.js', './rates.js', './manifest.json'];
  var VERSION_CHECK_MS = 10 * 60 * 1000;
  var swRegistration = null;
  var dlgClose = document.getElementById('dlgClose');
  var latestVersion = null, versionCheckedAt = 0, versionError = false, newWorkerActive = false;
  var promptedFor = null, autoPrompted = false;

  function updateAvailable(){
    return newWorkerActive || (latestVersion !== null && latestVersion !== APP_VERSION);
  }

  function renderAppUI(){
    var hasUpdate = updateAvailable();
    appBtn.classList.toggle('has-update', hasUpdate);
    appBtnLabel.textContent = hasUpdate ? "Nueva versión" : "v" + APP_VERSION;
    appBtn.title = hasUpdate ? "Hay una versión nueva: toca para actualizar" : "Versión de la app";

    dlgCurrent.textContent = "v" + APP_VERSION;
    dlgLatest.textContent = latestVersion ? "v" + latestVersion : (versionError ? "no disponible" : "buscando…");
    var cls = '', text;
    if(!navigator.onLine){ text = "Sin conexión: conéctate para buscar y bajar la última versión."; }
    else if(hasUpdate){ cls = 'new'; text = "Hay una versión nueva. Toca «Actualizar ahora» para cargarla."; }
    else if(latestVersion){ cls = 'ok'; text = "Ya tienes la última versión. Si algo se ve raro, «Actualizar ahora» vuelve a bajar todo desde el servidor."; }
    else if(versionError){ text = "No se pudo consultar la versión publicada. Igual puedes forzar la actualización."; }
    else { text = "Buscando la versión publicada…"; }
    dlgStatus.textContent = text;
    dlgStatus.className = 'sheet-status' + (cls ? ' ' + cls : '');
    dlgUpdate.disabled = !navigator.onLine;
    dlgClose.textContent = hasUpdate ? "Más tarde" : "Cerrar";
    maybePromptUpdate();
  }

  function openAppDialog(auto){
    autoPrompted = auto;
    if(updateAvailable()) promptedFor = latestVersion || 'sw'; // ya lo vio: no volver a abrirlo solo
    renderAppUI();
    if(appDialog.open) return;
    if(typeof appDialog.showModal === 'function') appDialog.showModal();
    else appDialog.setAttribute('open', '');
  }

  // Como en Leve Market: si hay versión nueva, el modal se abre solo (una vez por versión y
  // sesión; «Más tarde» lo deja en el botón de abajo). No interrumpe si se está editando una tasa.
  function maybePromptUpdate(){
    if(!updateAvailable() || appDialog.open || !navigator.onLine) return;
    // 'sw' = lo detectó el service worker antes de saber el número; es la misma actualización.
    var key = latestVersion || 'sw';
    if(promptedFor && (promptedFor === key || promptedFor === 'sw' || key === 'sw')) return;
    var active = document.activeElement;
    if(active && active.tagName === 'INPUT') return; // se reintenta al salir del campo
    promptedFor = key;
    openAppDialog(true);
  }

  async function checkLatestVersion(force){
    if(!navigator.onLine) { renderAppUI(); return; }
    if(!force && Date.now() - versionCheckedAt < VERSION_CHECK_MS) return;
    versionCheckedAt = Date.now();
    try{
      var r = await fetchWithTimeout('./index.html?fresh=' + Date.now(), { cache: 'no-store' }, 8000);
      if(!r.ok) throw new Error("HTTP " + r.status);
      // Solo dígitos y puntos: así esta misma línea nunca coincide consigo misma.
      var m = /APP_VERSION = "(\d+(?:\.\d+)+)"/.exec(await r.text());
      if(!m) throw new Error("sin APP_VERSION");
      latestVersion = m[1];
      versionError = false;
    }catch(e){
      versionError = true;
    }
    if(swRegistration) swRegistration.update().catch(function(){});
    renderAppUI();
  }

  // Espera (máx. ms) a que un SW que se está instalando quede activo.
  function waitForWorker(reg, ms){
    var w = reg && (reg.installing || reg.waiting);
    if(!w) return Promise.resolve();
    return new Promise(function(resolve){
      var done = function(){ resolve(); };
      setTimeout(done, ms);
      w.addEventListener('statechange', function(){
        if(w.state === 'activated' || w.state === 'redundant') done();
      });
    });
  }

  async function updateNow(){
    dlgUpdate.disabled = true;
    dlgUpdate.textContent = "Actualizando…";
    try{
      if(swRegistration){
        await swRegistration.update();
        await waitForWorker(swRegistration, 8000);
      }
    }catch(e){}
    try{
      var keys = await caches.keys();
      await Promise.all(keys.map(function(k){ return caches.delete(k); }));
    }catch(e){}
    try{
      // Pasa por el SW (que lo vuelve a guardar en su cache) pero saltándose el cache HTTP.
      await Promise.all(SHELL_FILES.map(function(u){ return fetch(u, { cache: 'reload' }); }));
    }catch(e){}
    location.reload();
  }

  appBtn.addEventListener('click', function(){
    openAppDialog(false);
    checkLatestVersion(true);
  });
  // Tocar fuera del recuadro cierra el modal, salvo el aviso automático (hay que elegir botón).
  appDialog.addEventListener('click', function(e){
    if(e.target === appDialog && !autoPrompted) appDialog.close();
  });
  appDialog.addEventListener('close', function(){ autoPrompted = false; });
  document.addEventListener('focusout', function(e){
    if(e.target && e.target.tagName === 'INPUT') setTimeout(maybePromptUpdate, 300);
  });
  dlgUpdate.addEventListener('click', updateNow);
  window.addEventListener('online', renderAppUI);
  window.addEventListener('offline', renderAppUI);

  if('serviceWorker' in navigator){
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(hadController){ newWorkerActive = true; renderAppUI(); }
      hadController = true;
    });
    navigator.serviceWorker.register('sw.js').then(function(reg){
      swRegistration = reg;
    }).catch(function(){ /* offline no disponible en este navegador/origen */ });
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkLatestVersion(false);
  });
  setInterval(function(){
    if(document.visibilityState === 'visible') checkLatestVersion(true);
  }, 30 * 60 * 1000);
  renderAppUI();
  setTimeout(function(){ checkLatestVersion(false); }, 3000);

  // ---------- Instalar (PWA) ----------
  // El navegador avisa cuando se puede instalar; el botón vive en el modal.
  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener('click', async function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener('appinstalled', function(){
    installBtn.hidden = true;
  });
})();
</script>

</body>
</html>
