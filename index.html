<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Calculadora BCV · Binance P2P</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c0e">
<meta name="background-color" content="#0b0c0e">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Calculadora lite con conversión en vivo a tasa BCV y Binance P2P">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc Bs">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- Android / Chrome -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<style>
  :root{
    --bg:#000000;
    --panel:#000000;
    --key:#161616;
    --accent:#ff7a3d;
    --text:#f5f5f2;
    --muted:#8a8d93;
    --history:#5a5c60;
    --bcv:#5b8fb0;
    --binance:#f0b90b;
    --amarillo:#f7c948;
    --azul:#2b4c8c;
    --rojo:#c1272d;
    --border:rgba(255,255,255,.08);
    --hairline:rgba(255,255,255,.25);
    --row-bg:rgba(255,255,255,.03);
    --shadow:rgba(0,0,0,.6);
    --gap:#000000;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f2f2f0;
    --panel:#f2f2f0;
    --key:#e9e9e6;
    --accent:#e35a1c;
    --text:#17181c;
    --muted:#6b6f76;
    --history:#9a9da3;
    --border:rgba(0,0,0,.08);
    --hairline:rgba(0,0,0,.25);
    --row-bg:rgba(0,0,0,.04);
    --shadow:rgba(0,0,0,.15);
    --gap:#e2e2df;
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:16px;
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
    overscroll-behavior:none;
  }
  .app{
    width:100%;
    max-width:360px;
    background:var(--panel);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 20px 50px var(--shadow);
    border:1px solid var(--border);
  }
  .tricolor{height:3px;display:flex;}
  .tricolor span{flex:1;}
  .tricolor .a{background:var(--amarillo);}
  .tricolor .b{background:var(--azul);}
  .tricolor .c{background:var(--rojo);}

  .display{padding:16px 20px 14px;}
  .top-row{display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:6px;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#3ac16a;flex-shrink:0;}
  .status-dot.offline{background:#8a8d93;}
  .theme-toggle{
    background:none;
    border:none;
    color:var(--muted);
    font-size:15px;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
    margin-right:auto;
  }
  .refresh-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
  }
  .refresh-btn.loading{animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .history{
    display:flex;
    flex-direction:column;
    gap:2px;
    text-align:right;
    max-height:64px;
    overflow-y:auto;
    scrollbar-width:none;
  }
  .history::-webkit-scrollbar{display:none;}
  .history-row{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:13px;
    color:var(--history);
    white-space:nowrap;
    flex-shrink:0;
  }
  .history-row .h-expr{margin-right:6px;}
  .history-row.op1{opacity:.35;}
  .history-row.op2{opacity:.5;}
  .history-row.op3{opacity:.65;}
  .history-row.op4{opacity:.8;}

  .expr-line{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:16px;
    color:var(--muted);
    text-align:right;
    min-height:20px;
    letter-spacing:.3px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
  }
  .expr-line::-webkit-scrollbar{display:none;}

  .digits{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-weight:500;
    text-align:right;
    line-height:1.15;
    letter-spacing:.5px;
    min-height:52px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
    margin-top:2px;
    font-size:34px;
    transition:font-size .08s ease;
  }
  .digits.is-result{ font-size:44px; }
  .digits::-webkit-scrollbar{display:none;}

  .conversions{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
  .conv-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    background:var(--row-bg);
    border-radius:10px;
    padding:7px 10px;
  }
  .conv-label{display:flex; align-items:center; gap:7px; flex-shrink:0;}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .dot.bcv{background:var(--bcv);}
  .dot.binance{background:var(--binance);}
  .rate-edit{
    background:none;
    border:none;
    border-bottom:1px dashed var(--hairline);
    color:var(--text);
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:12.5px;
    width:64px;
    text-align:right;
    padding:0 0 1px;
  }
  .rate-edit:focus{outline:none; border-bottom-color:var(--text);}
  .conv-result{
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
    color:var(--text);
    font-size:14px;
    font-weight:600;
    margin-left:8px;
  }

  .update-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
    padding:0 2px;
  }
  .update-info{
    font-size:10.5px;
    color:var(--muted);
  }
  .update-btn{
    display:flex;
    align-items:center;
    gap:5px;
    background:none;
    border:none;
    color:var(--accent);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:3px 4px;
  }
  .update-btn .spin{display:inline-block;}
  .update-btn.loading .spin{animation:spin 0.9s linear infinite;}

  .keypad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--gap);
    padding-top:1px;
  }
  button.key{
    border:none;
    background:var(--key);
    color:var(--text);
    font-size:24px;
    font-weight:400;
    padding:16px 0;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
  }
  button.key:active{filter:brightness(1.5);}
  button.key.op{color:var(--accent); font-weight:500; font-size:22px;}
  button.key.paren{color:var(--accent); font-weight:500; font-size:19px;}
  button.key.fn{color:var(--accent); font-size:20px;}
  button.key.fn.clear{font-weight:700;}
  button.key.mode-key{
    color:var(--text);
    font-size:12px;
    font-weight:700;
    letter-spacing:.2px;
  }
  .key-eq-cell{display:flex; align-items:center; justify-content:center; background:var(--key);}
  button.key.eq{
    background:var(--accent);
    color:#1a0e00;
    font-weight:700;
    font-size:22px;
    width:52px;
    height:52px;
    border-radius:50%;
    padding:0;
  }

  .footnote{
    text-align:center;
    color:var(--muted);
    font-size:10.5px;
    padding:8px 12px 4px;
    line-height:1.4;
  }

  .install-row{
    padding:0 12px;
  }
  .install-btn{
    display:none;
    width:100%;
    background:var(--key);
    color:var(--text);
    border:none;
    border-radius:12px;
    padding:11px 0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:14px;
  }
  .install-btn.show{display:block;}

  @media (max-width:480px){
    body{
      padding:0;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
      align-items:stretch;
    }
    .app{
      max-width:none;
      width:100%;
      height:100%;
      min-height:100dvh;
      border-radius:0;
      box-shadow:none;
      border:none;
      display:flex;
      flex-direction:column;
    }
    .keypad{
      flex:1;
      grid-template-rows:repeat(6, 1fr);
      min-height:280px;
    }
    button.key{
      height:100%;
      padding:0;
      font-size:26px;
    }
    button.key.op{font-size:24px;}
    .key-eq-cell button.key.eq{
      width:60px;
      height:60px;
      font-size:24px;
    }
    .footnote{padding-bottom:max(8px, env(safe-area-inset-bottom));}
  }
</style>
<script>
(function(){
  try{
    var saved = localStorage.getItem('theme');
    var theme = (saved === 'light' || saved === 'dark') ? saved
      : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
</head>
<body>

<div class="app">
  <div class="tricolor"><span class="a"></span><span class="b"></span><span class="c"></span></div>

  <div class="display">
    <div class="top-row">
      <button class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>
      <span class="status-dot" id="statusDot" title="Conexión"></span>
    </div>

    <div class="history" id="historyBox"></div>
    <div class="expr-line" id="exprLine">&nbsp;</div>
    <div class="digits" id="digits">0</div>

    <div class="conversions">
      <div class="conv-row">
        <span class="conv-label"><span class="dot bcv"></span>BCV</span>
        <span>
          <input class="rate-edit" id="bcvRate" value="771,07" inputmode="decimal">
          <span class="conv-result" id="bcvResult">Bs 0,00</span>
        </span>
      </div>
      <div class="conv-row">
        <span class="conv-label"><span class="dot binance"></span>Binance P2P</span>
        <span>
          <input class="rate-edit" id="p2pRate" value="885,60" inputmode="decimal">
          <span class="conv-result" id="p2pResult">Bs 0,00</span>
        </span>
      </div>
    </div>

    <div class="update-row">
      <span class="update-info" id="updateInfo">Toca para traer la tasa más reciente</span>
      <button class="update-btn" id="refreshBtn"><span class="spin">⟳</span> Actualizar</button>
    </div>
  </div>

  <div class="keypad">
    <button class="key paren" data-k="popen" style="grid-column: span 2;">(</button>
    <button class="key paren" data-k="pclose" style="grid-column: span 2;">)</button>

    <button class="key fn clear" data-k="ac">C</button>
    <button class="key fn" data-k="back">⌫</button>
    <button class="key fn" data-k="pct">%</button>
    <button class="key op" data-k="div">÷</button>

    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key op" data-k="mul">×</button>

    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key op" data-k="sub">−</button>

    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key op" data-k="add">+</button>

    <button class="key mode-key" id="modeBtn">USD<br>⇄ Bs</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k="dot">,</button>
    <div class="key-eq-cell"><button class="key eq" data-k="eq">=</button></div>
  </div>

  <div class="footnote">Toca una tasa para editarla · valores de referencia</div>
  <div class="install-row"><button class="install-btn" id="installBtn">Instalar app</button></div>
</div>

<script>
(function(){
  "use strict";

  var digitsEl = document.getElementById('digits');
  var exprLineEl = document.getElementById('exprLine');
  var historyBox = document.getElementById('historyBox');

  var OPS = ["+","−","×","÷"];
  function isOperator(t){ return OPS.indexOf(t) !== -1; }
  function isNumberToken(t){ return t !== undefined && t !== null && !isOperator(t) && t !== "(" && t !== ")"; }

  var tokens = [];
  var currentNumber = "";
  var justEqualed = false;
  var history = []; // {expr, result}

  function countOpen(toks){
    var c = 0;
    for(var i=0;i<toks.length;i++){ if(toks[i]==="(") c++; else if(toks[i]===")") c--; }
    return c;
  }

  function groupNumber(str){
    if(str === "") return "";
    var neg = str.startsWith("-");
    if(neg) str = str.slice(1);
    var parts = str.split(".");
    var intPart = parts[0] === "" ? "0" : parts[0];
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    var out = intPart;
    if(parts.length > 1) out += "," + parts[1];
    return (neg ? "-" : "") + out;
  }

  function displayToken(t){
    return (isOperator(t) || t === "(" || t === ")") ? t : groupNumber(t);
  }

  function liveExprString(){
    var parts = tokens.map(displayToken);
    if(currentNumber !== "") parts.push(groupNumber(currentNumber));
    var s = parts.join('');
    return s === "" ? "0" : s;
  }

  function renderHistory(){
    var shown = history.slice(-20);
    var classes = ["op1","op2","op3","op4"];
    historyBox.innerHTML = shown.map(function(h, i){
      var c = i >= shown.length - 4 ? classes[4 - (shown.length - i)] : "op1";
      return '<div class="history-row ' + c + '"><span class="h-expr">' + h.expr + ' =</span>' + h.result + '</div>';
    }).join('');
    historyBox.scrollTop = historyBox.scrollHeight;
  }

  function render(){
    if(justEqualed){
      digitsEl.classList.add('is-result');
      digitsEl.textContent = groupNumber(currentNumber);
      exprLineEl.textContent = history.length ? (history[history.length-1].expr + " =") : "";
    } else {
      digitsEl.classList.remove('is-result');
      digitsEl.textContent = liveExprString();
      exprLineEl.innerHTML = "&nbsp;";
    }
    renderHistory();
    updateConversions();
  }

  function pressDigit(d){
    if(justEqualed){
      tokens = [];
      currentNumber = d === "." ? "0." : d;
      justEqualed = false;
      render();
      return;
    }
    if(currentNumber === "0" && d !== "."){ currentNumber = d; }
    else if(d === "." && currentNumber.includes(".")){ /* ignore */ }
    else if(d === "." && currentNumber === ""){ currentNumber = "0."; }
    else {
      if(currentNumber.replace(/[.-]/g,"").length >= 14) return;
      currentNumber += d;
    }
    render();
  }

  function backspace(){
    if(justEqualed){
      tokens = []; currentNumber = ""; justEqualed = false; render(); return;
    }
    if(currentNumber !== ""){
      currentNumber = currentNumber.length > 1 ? currentNumber.slice(0, -1) : "";
    } else if(tokens.length){
      tokens.pop();
    }
    render();
  }

  function percent(){
    if(currentNumber === "") return;
    var n = parseFloat(currentNumber) || 0;
    currentNumber = String(n / 100);
    render();
  }

  function clearAll(){
    tokens = []; currentNumber = ""; justEqualed = false;
    render();
  }

  function pressOperator(op){
    if(justEqualed){
      tokens = [currentNumber];
      currentNumber = "";
      justEqualed = false;
    }
    if(currentNumber !== ""){
      tokens.push(currentNumber);
      currentNumber = "";
    }
    if(tokens.length === 0) return;
    var last = tokens[tokens.length - 1];
    if(isOperator(last)){
      tokens[tokens.length - 1] = op;
    } else if(last === "("){
      return; // no operand yet after "("
    } else {
      tokens.push(op);
    }
    render();
  }

  function pressParen(which){
    if(justEqualed){
      if(which === "("){ tokens = []; currentNumber = ""; justEqualed = false; }
      else { return; }
    }
    if(which === ")"){
      var openNow = countOpen(tokens);
      var last = currentNumber !== "" ? null : (tokens.length ? tokens[tokens.length-1] : null);
      if(currentNumber === "" && (last === null || isOperator(last) || last === "(")) return;
      if(openNow <= 0) return;
    }
    if(currentNumber !== ""){
      tokens.push(currentNumber);
      currentNumber = "";
      if(which === "(") tokens.push("×"); // implicit multiplication: 5( -> 5×(
    } else if(which === "(" && tokens.length){
      var lastTok = tokens[tokens.length - 1];
      if(isNumberToken(lastTok) || lastTok === ")"){ tokens.push("×"); }
    }
    tokens.push(which);
    render();
  }

  function evalExpr(toks){
    var pos = 0;
    function factor(){
      var t = toks[pos];
      if(t === "("){ pos++; var v = expr(); if(toks[pos] === ")") pos++; return v; }
      if(t === "−"){ pos++; return -factor(); }
      pos++;
      return parseFloat(t);
    }
    function term(){
      var v = factor();
      while(toks[pos] === "×" || toks[pos] === "÷"){
        var op = toks[pos]; pos++;
        var rhs = factor();
        v = op === "×" ? v * rhs : (rhs === 0 ? 0 : v / rhs);
      }
      return v;
    }
    function expr(){
      var v = term();
      while(toks[pos] === "+" || toks[pos] === "−"){
        var op = toks[pos]; pos++;
        var rhs = term();
        v = op === "+" ? v + rhs : v - rhs;
      }
      return v;
    }
    return expr();
  }

  function trimResult(n){
    if(!isFinite(n)) return "0";
    var s = n.toFixed(8).replace(/0+$/,"").replace(/\.$/,"");
    if(s.length > 14) s = parseFloat(n.toPrecision(10)).toString();
    return s;
  }

  function pushHistory(expr, resultStr){
    history.push({expr: expr, result: resultStr});
    if(history.length > 20) history.shift();
  }

  function equals(){
    var toks = tokens.slice();
    if(currentNumber !== ""){ toks.push(currentNumber); }
    else if(toks.length && isOperator(toks[toks.length - 1])){ toks.pop(); }
    var openCount = countOpen(toks);
    for(var i = 0; i < openCount; i++) toks.push(")");
    if(toks.length < 1) return;

    var exprDisplay = toks.map(displayToken).join('');
    var resultNum;
    try{ resultNum = evalExpr(toks); }catch(e){ resultNum = NaN; }
    var resultVal = trimResult(resultNum);
    pushHistory(exprDisplay, groupNumber(resultVal));

    tokens = [];
    currentNumber = resultVal;
    justEqualed = true;
    render();
  }

  var keyMap = {
    ac: clearAll, back: backspace, pct: percent,
    add: function(){ pressOperator("+"); },
    sub: function(){ pressOperator("−"); },
    mul: function(){ pressOperator("×"); },
    div: function(){ pressOperator("÷"); },
    popen: function(){ pressParen("("); },
    pclose: function(){ pressParen(")"); },
    eq: equals,
    dot: function(){ pressDigit("."); }
  };

  document.querySelector('.keypad').addEventListener('click', function(e){
    var btn = e.target.closest('.key');
    if(!btn || btn.id === 'modeBtn') return;
    var k = btn.dataset.k;
    if(/^[0-9]$/.test(k)){ pressDigit(k); return; }
    if(keyMap[k]) keyMap[k]();
  });

  document.addEventListener('keydown', function(e){
    if(/^[0-9]$/.test(e.key)){ pressDigit(e.key); return; }
    if(e.key === "."){ pressDigit("."); return; }
    if(e.key === "+"){ pressOperator("+"); return; }
    if(e.key === "-"){ pressOperator("−"); return; }
    if(e.key === "*"){ pressOperator("×"); return; }
    if(e.key === "/"){ e.preventDefault(); pressOperator("÷"); return; }
    if(e.key === "("){ pressParen("("); return; }
    if(e.key === ")"){ pressParen(")"); return; }
    if(e.key === "Enter" || e.key === "="){ equals(); return; }
    if(e.key === "Escape"){ clearAll(); return; }
    if(e.key === "Backspace"){ backspace(); return; }
  });

  // ---------- Currency conversion ----------
  var mode = "usd";
  var modeBtn = document.getElementById('modeBtn');
  var bcvInput = document.getElementById('bcvRate');
  var p2pInput = document.getElementById('p2pRate');
  var bcvResult = document.getElementById('bcvResult');
  var p2pResult = document.getElementById('p2pResult');

  function currentValue(){
    if(currentNumber !== "") return parseFloat(currentNumber) || 0;
    for(var i = tokens.length - 1; i >= 0; i--){
      if(isNumberToken(tokens[i])) return parseFloat(tokens[i]) || 0;
    }
    return 0;
  }

  function parseRate(str){
    var n = parseFloat(String(str).replace(/\./g,"").replace(",", "."));
    return isFinite(n) && n > 0 ? n : 0;
  }

  function fmtVES(n){
    return "Bs " + n.toLocaleString("es-VE", {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtUSD(n){
    return "$" + n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function updateConversions(){
    var amount = currentValue();
    var bcvRate = parseRate(bcvInput.value);
    var p2pRate = parseRate(p2pInput.value);

    if(mode === "usd"){
      bcvResult.textContent = fmtVES(amount * bcvRate);
      p2pResult.textContent = fmtVES(amount * p2pRate);
    } else {
      bcvResult.textContent = bcvRate ? fmtUSD(amount / bcvRate) : fmtUSD(0);
      p2pResult.textContent = p2pRate ? fmtUSD(amount / p2pRate) : fmtUSD(0);
    }
  }

  modeBtn.addEventListener('click', function(){
    mode = mode === "usd" ? "ves" : "usd";
    modeBtn.innerHTML = mode === "usd" ? "USD<br>⇄ Bs" : "Bs<br>⇄ USD";
    updateConversions();
  });

  [bcvInput, p2pInput].forEach(function(input){
    var storeKey = input === bcvInput ? 'bcvRate' : 'p2pRate';
    input.addEventListener('input', function(){
      updateConversions();
      try{ localStorage.setItem(storeKey, input.value); }catch(e){}
    });
    input.addEventListener('focus', function(){ input.select(); });
  });

  // ---------- Live rate fetch ----------
  var refreshBtn = document.getElementById('refreshBtn');
  var updateInfo = document.getElementById('updateInfo');
  var lastFetch = null;

  function setBcv(value){ bcvInput.value = value.toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function setP2p(value){ p2pInput.value = value.toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2}); }

  function loadSavedRates(){
    try{
      var savedBcv = localStorage.getItem('bcvRate');
      var savedP2p = localStorage.getItem('p2pRate');
      var savedFetch = localStorage.getItem('lastFetch');
      if(savedBcv) bcvInput.value = savedBcv;
      if(savedP2p) p2pInput.value = savedP2p;
      if(savedFetch){ lastFetch = new Date(parseInt(savedFetch, 10)); }
    }catch(e){}
  }

  function saveRates(){
    try{
      localStorage.setItem('bcvRate', bcvInput.value);
      localStorage.setItem('p2pRate', p2pInput.value);
      if(lastFetch) localStorage.setItem('lastFetch', String(lastFetch.getTime()));
    }catch(e){}
  }

  function fetchWithTimeout(url, opts, ms){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, ms);
    opts = Object.assign({}, opts, {signal: controller.signal});
    return fetch(url, opts).finally(function(){ clearTimeout(timer); });
  }

  function relativeTime(date){
    var sec = Math.floor((Date.now() - date.getTime()) / 1000);
    if(sec < 45) return "hace un momento";
    var min = Math.floor(sec / 60);
    if(min < 60) return "hace " + min + (min === 1 ? " min" : " min");
    var hr = Math.floor(min / 60);
    return "hace " + hr + (hr === 1 ? " hora" : " horas");
  }

  function tickUpdateInfo(){
    if(lastFetch) updateInfo.textContent = "Actualizado " + relativeTime(lastFetch);
  }
  setInterval(tickUpdateInfo, 30000);

  async function fetchRates(){
    if(!navigator.onLine){
      updateInfo.textContent = "Sin conexión · valores manuales";
      return false;
    }
    refreshBtn.classList.add('loading');
    updateInfo.textContent = "Actualizando…";
    var okAny = false;

    try{
      var r = await fetchWithTimeout('https://ve.dolarapi.com/v1/dolares/oficial', undefined, 6000);
      if(r.ok){
        var d = await r.json();
        if(d && d.promedio){ setBcv(d.promedio); okAny = true; }
      }
    }catch(e){ /* sin conexión al endpoint BCV, se mantiene edición manual */ }

    try{
      var r2 = await fetchWithTimeout('https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({page:1, rows:5, asset:'USDT', tradeType:'SELL', fiat:'VES', payTypes:[], publisherType:null})
      }, 6000);
      if(r2.ok){
        var d2 = await r2.json();
        var list = d2 && d2.data;
        if(list && list.length){
          var prices = list.map(function(x){ return parseFloat(x.adv.price); }).filter(function(n){ return isFinite(n); });
          if(prices.length){
            prices.sort(function(a,b){ return a-b; });
            var median = prices[Math.floor(prices.length/2)];
            setP2p(median); okAny = true;
          }
        }
      }
    }catch(e){ /* Binance bloquea CORS desde el navegador en muchos entornos; se mantiene edición manual */ }

    refreshBtn.classList.remove('loading');
    if(okAny){ lastFetch = new Date(); tickUpdateInfo(); saveRates(); }
    else { updateInfo.textContent = "No se pudo actualizar · edita a mano"; }
    updateConversions();
    return okAny;
  }

  refreshBtn.addEventListener('click', fetchRates);
  window.addEventListener('load', function(){ fetchRates(); });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') fetchRates();
  });

  loadSavedRates();
  tickUpdateInfo();
  render();

  // ---------- Theme toggle ----------
  var themeToggle = document.getElementById('themeToggle');
  var themeColorMeta = document.querySelector('meta[name="theme-color"]');
  var THEME_COLORS = { dark: "#0b0c0e", light: "#f2f2f0" };

  function applyThemeUI(){
    var theme = document.documentElement.getAttribute('data-theme') || 'dark';
    themeColorMeta.setAttribute('content', THEME_COLORS[theme]);
    themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
    themeToggle.title = theme === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro';
  }
  applyThemeUI();

  themeToggle.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
    applyThemeUI();
  });

  // ---------- PWA: online/offline status ----------
  var statusDot = document.getElementById('statusDot');
  function updateStatus(){
    statusDot.classList.toggle('offline', !navigator.onLine);
    statusDot.title = navigator.onLine ? 'En línea' : 'Sin conexión (modo offline)';
  }
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);
  updateStatus();

  // ---------- PWA: service worker registration ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* offline no disponible en este navegador/origen */ });
    });
  }

  // ---------- PWA: install prompt ----------
  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });

  installBtn.addEventListener('click', async function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.classList.remove('show');
  });

  window.addEventListener('appinstalled', function(){
    installBtn.classList.remove('show');
  });
})();
</script>

</body>
</html>
